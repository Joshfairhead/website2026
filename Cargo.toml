[package]
name = "website2026"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
pulldown-cmark = "0.13.4"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"

# Image decoding is painfully slow unoptimised; keep dependencies fast in dev builds.
[profile.dev.package."*"]
opt-level = 2
