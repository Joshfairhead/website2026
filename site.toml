# The site tree: single source of truth for nodes, menus, breadcrumbs and breakouts.
# See docs/information-architecture.md.
#
# Each [[node]] has:
#   id        unique slug; also its path segment
#   label     display name
#   parent    id of the parent node (omit for a branch, which sits under the root)
#   collection  "music" or "art" for nodes whose content includes data files
#   breakout  optional host this node's subtree is deployed to as its own site

[site]
title = "Josh Fairhead"
base_url = "https://joshafairhead.com"
contact = "hello@joshafairhead.com"

